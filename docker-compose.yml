services:
  objdock:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    # Prebuilt image from Docker Hub (multi-arch: amd64/arm64).
    # `docker compose up -d` pulls it automatically — no build needed.
    # Add --build to build from source instead.
    image: pal537/objdock:latest
    container_name: objdock
    restart: unless-stopped
    ports:
      # Bind to localhost only; put nginx/Caddy in front for HTTPS.
      - "127.0.0.1:8080:8080"
    environment:
      # Optional: base64-encoded 32-byte key for credential encryption.
      # If unset, ObjDock generates one on first start and saves it to
      # the data volume automatically — nothing for you to do.
      # (Generate one manually with: docker run --rm objdock:latest /objdock genkey)
      - OBJDOCK_ENCRYPTION_KEY=${OBJDOCK_ENCRYPTION_KEY:-}
      # Set to 1 when serving over HTTPS (so cookies get the Secure flag).
      - OBJDOCK_SECURE_COOKIES=1
    volumes:
      - objdock-data:/data

volumes:
  objdock-data:
